<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make passwords</title>
<script>window.CPL_NOGATE = true;</script>
<script src="auth.js"></script>
<style>body{font-family:system-ui,Arial,sans-serif;background:#f7f5ef;color:#1f2a1f;margin:0}header{background:#2b4127;color:#fff;padding:16px;text-align:center;border-bottom:4px solid #c98a2c}
.w{max-width:520px;margin:0 auto;padding:14px}label{display:block;font-weight:700;margin:12px 0 4px}input{width:100%;font-size:16px;padding:10px;border:1px solid #d8d3c4;border-radius:8px}
button{margin-top:16px;width:100%;border:0;border-radius:8px;padding:13px;font-size:15px;font-weight:700;background:#2b4127;color:#fff}p{font-size:13px;color:#555}</style></head>
<body><header><h1 style="margin:0;font-size:19px">Make new passwords</h1></header><div class="w">
<p>Type the 3 passwords you want. Press the button. It downloads a small file called <b>passwords.js</b>. Upload that file to your GitHub repo (replace the old one). Everyone will be asked to log in again with the new passwords.</p>
<label>Viewer password (view &amp; PDF only)</label><input id="v" type="text" autocomplete="off">
<label>Co-worker password (enter records &amp; PDF)</label><input id="c" type="text" autocomplete="off">
<label>Administrator password (everything)</label><input id="a" type="text" autocomplete="off">
<button onclick="go()">Make passwords.js</button><p id="m"></p></div>
<script>
function go(){
  var v=document.getElementById('v').value.trim(),c=document.getElementById('c').value.trim(),a=document.getElementById('a').value.trim(),m=document.getElementById('m');
  if(!v||!c||!a){m.textContent="Please fill all three.";return;}
  if(v===c||v===a||c===a){m.textContent="The 3 passwords must be different from each other.";return;}
  if(v.length<6||c.length<6||a.length<6){m.textContent="Each password should be at least 6 characters.";return;}
  var H=CPL_AUTH.hash, txt='window.CPL_PW = { viewer:"'+H(v)+'", coworker:"'+H(c)+'", admin:"'+H(a)+'" };\n';
  var b=new Blob([txt],{type:'text/javascript'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='passwords.js';document.body.appendChild(l);l.click();l.remove();
  m.textContent="Done. passwords.js was downloaded. Upload it to GitHub.";
}
</script></body></html>
