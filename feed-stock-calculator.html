<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed Stock Calculator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --ink:#1f2a1f;
    --paper:#f7f5ef;
    --green:#3f5d3a;
    --green-dark:#2b4127;
    --amber:#c98a2c;
    --line:#d8d3c4;
    --card:#ffffff;
    --red:#b3261e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding-bottom:100px;
  }
  header{
    background:var(--green-dark);
    color:#fff;
    padding:18px 16px 16px;
    border-bottom:3px solid var(--amber);
    position:sticky;
    top:0;
    z-index:10;
  }
  header h1{ margin:0; font-size:16.5px; font-weight:700; letter-spacing:.3px; }
  header p{ margin:4px 0 0; font-size:12.5px; opacity:.85; letter-spacing:.2px; }
  .wrap{max-width:960px;margin:0 auto;padding:14px;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    margin-bottom:14px;
    box-shadow:0 1px 3px rgba(43,65,39,0.06);
  }
  .card h2{
    font-size:13px;
    margin:0 0 10px;
    color:#fff;
    background:var(--green-dark);
    text-transform:uppercase;
    letter-spacing:.5px;
    padding:8px 10px;
    border-radius:6px;
    border-left:4px solid var(--amber);
  }
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .field{flex:1;min-width:140px;}
  label{ display:block; font-size:10.5px; color:#5a5a4f; margin-bottom:3px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; }
  input{
    width:100%;
    padding:8px 8px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:13.5px;
    background:#fff;
    color:var(--ink);
    font-weight:600;
  }
  input[readonly]{ background:#f0efe8; color:var(--green-dark); }
  input:focus{ outline:2px solid var(--green); outline-offset:1px; }

  table.grid{
    width:100%;
    border-collapse:collapse;
    font-size:12.5px;
  }
  table.grid th{
    background:var(--green-dark);
    color:#fff;
    padding:12px 8px;
    font-size:11px;
    font-weight:700;
    text-align:center;
    border:1px solid var(--green-dark);
    border-bottom:2px solid var(--amber);
  }
  table.grid td{
    border:1px solid var(--line);
    padding:11px 8px;
    text-align:center;
  }
  table.grid input{
    padding:9px 6px;
    font-size:13px;
    text-align:center;
    min-width:70px;
  }
  td.total-cell input{
    background:#fbeceb;
    color:var(--red);
    font-weight:800;
  }
  .scroll-x{ overflow-x:auto; }
  .remove-btn{
    background:none;
    border:none;
    color:#a33b2b;
    font-size:15px;
    padding:0 4px;
  }
  .add-row{
    margin-top:10px;
    background:none;
    border:1px dashed var(--green);
    color:var(--green-dark);
    padding:9px 12px;
    border-radius:6px;
    font-size:12.5px;
    font-weight:700;
    width:100%;
  }

  .grand-total{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:6px;
    padding-top:12px;
    border-top:2px solid var(--green);
    font-size:15px;
    font-weight:700;
  }
  .grand-total .value{ color:var(--red); font-size:20px; }
  .hint{ font-size:11px; color:#7a7a6d; margin-top:6px; }

  footer.bar{
    position:fixed;
    bottom:0;left:0;right:0;
    background:var(--card);
    border-top:1px solid var(--line);
    padding:10px 14px;
    display:flex;
    gap:10px;
    z-index:20;
  }
  .btn{ flex:1; padding:13px; border-radius:8px; border:none; font-size:14.5px; font-weight:700; }
  .btn-primary{ background:var(--amber); color:#fff; }
  .btn-secondary{ background:var(--green-dark); color:#fff; }
</style>
</head>
<body>

<header>
  <h1>Feed Stock Calculator</h1>
  <p>CPL Poultry Division</p>
  <p id="rec-status" style="font-size:12px;margin-top:6px;"></p>
</header>

<div class="wrap">

  <div class="card">
    <h2>Record Details</h2>
    <div class="row">
      <div class="field"><label>Date</label><input type="date" id="f-date"></div>
      <div class="field"><label>Recorded By</label><input type="text" id="f-name" placeholder="e.g. Robert Wartovo"></div>
    </div>
  </div>

  <div class="card">
    <h2>Feed Bags</h2>
    <div class="scroll-x" style="margin-top:10px;">
      <table class="grid" id="feed-table">
        <thead>
          <tr>
            <th>Name of Feed</th>
            <th>No. of Bags</th>
            <th>Kg per Bag</th>
            <th>Total Kg</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <button class="add-row" onclick="addFeed()">+ Add feed</button>
    <p class="hint">Kg per Bag defaults to 40 — change it for any feed that comes in a different bag size. Total Kg = No. of Bags × Kg per Bag, calculated automatically.</p>

    <div class="grand-total">
      <span>Total Feed (kg)</span>
      <span class="value" id="grand-total">0</span>
    </div>
  </div>

</div>

<footer class="bar">
  <button class="btn btn-secondary" onclick="clearForm()">Clear</button>
  <button class="btn btn-primary" onclick="generatePDF()">Generate PDF</button>
</footer>

<script>
let rowCount = 0;

function addFeed(){
  const tbody = document.querySelector("#feed-table tbody");
  const i = rowCount++;
  const tr = document.createElement("tr");
  tr.id = `row-${i}`;
  tr.innerHTML = `
    <td><input type="text" data-i="${i}" data-k="name" placeholder="e.g. Starter"></td>
    <td><input type="number" min="0" data-i="${i}" data-k="bags" oninput="updateRow(${i})"></td>
    <td><input type="number" min="0" data-i="${i}" data-k="kgPerBag" value="40" oninput="updateRow(${i})"></td>
    <td class="total-cell"><input type="text" id="total-${i}" readonly></td>
    <td><button class="remove-btn" onclick="removeFeed(${i})">✕</button></td>
  `;
  tbody.appendChild(tr);
}

function removeFeed(i){
  const row = document.getElementById(`row-${i}`);
  if(row) row.remove();
  updateGrandTotal();
}

function val(i,k){
  const el = document.querySelector(`[data-i="${i}"][data-k="${k}"]`);
  return el ? el.value : "";
}

function updateRow(i){
  const bags = parseFloat(val(i,"bags")) || 0;
  const kgPerBag = parseFloat(val(i,"kgPerBag")) || 0;
  document.getElementById(`total-${i}`).value = bags * kgPerBag;
  updateGrandTotal();
}

function updateGrandTotal(){
  let grand = 0;
  const trs = document.querySelectorAll("#feed-table tbody tr");
  trs.forEach(tr=>{
    const i = tr.id.replace("row-","");
    const bags = parseFloat(val(i,"bags")) || 0;
    const kgPerBag = parseFloat(val(i,"kgPerBag")) || 0;
    grand += bags * kgPerBag;
  });
  document.getElementById("grand-total").textContent = grand;
}

addFeed();

// ================= OFFLINE RECORDS DATABASE (shared by the CPL apps) =================
// Everything is saved inside this browser (localStorage), one record per date.
const CPL_DB_KEY = "cpl_records_v1";
let _cplDbWarned = false;
function cplDbLoad(){
  try{
    const r = JSON.parse(localStorage.getItem(CPL_DB_KEY));
    if(r && r.records) return r;
  }catch(e){}
  return { version:1, records:{} };
}
function cplDbGet(date, section){
  const db = cplDbLoad();
  return (db.records[date] && db.records[date][section]) || null;
}
function cplDbPut(date, section, payload){
  try{
    const db = cplDbLoad();
    if(!db.records[date]) db.records[date] = {};
    payload.updated = new Date().toISOString();
    db.records[date][section] = payload;
    localStorage.setItem(CPL_DB_KEY, JSON.stringify(db));
    return true;
  }catch(e){
    if(!_cplDbWarned){
      _cplDbWarned = true;
      alert("Could not save to the records database (storage full or blocked). Open the Monthly Records page and download a backup.");
    }
    return false;
  }
}
function cplStatus(msg, ok){
  const el = document.getElementById("rec-status");
  if(!el) return;
  el.textContent = msg;
  el.style.color = ok === false ? "#ffb4ab" : "#cfe6c8";
}
if("serviceWorker" in navigator && /^https?:/.test(location.protocol)){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

// ---- Autosave into the records database (one record per date) ----
function cplFeedRows(){
  const rows = [];
  document.querySelectorAll("#feed-table tbody tr").forEach(tr=>{
    const i = tr.id.replace("row-","");
    const name = val(i,"name"), bags = val(i,"bags"), kg = val(i,"kgPerBag");
    if(!name && !bags) return;
    rows.push({ name:name, bags:parseFloat(bags)||0, kgPerBag:parseFloat(kg)||0, totalKg:(parseFloat(bags)||0)*(parseFloat(kg)||0) });
  });
  return rows;
}
let _cplTimer = null, _cplRestoring = false;
function cplScheduleSave(){ if(_cplRestoring) return; clearTimeout(_cplTimer); _cplTimer = setTimeout(cplSaveNow, 400); }
function cplSaveNow(){
  const date = document.getElementById("f-date").value;
  if(!date){ cplStatus("Pick a Date to start saving this record automatically."); return; }
  const rows = cplFeedRows();
  const ok = cplDbPut(date, "feedstock", { rows:rows, name:document.getElementById("f-name").value, grandTotal:rows.reduce((a,r)=>a+r.totalKg,0) });
  if(ok) cplStatus("Saved to records database — " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}));
  else cplStatus("NOT saved — storage problem", false);
}
function cplRestoreFeed(rec){
  _cplRestoring = true;
  try{
    document.querySelector("#feed-table tbody").innerHTML = "";
    rowCount = 0;
    const rows = rec.rows && rec.rows.length ? rec.rows : [null];
    rows.forEach(r=>{
      addFeed();
      const i = rowCount - 1;
      if(r){
        document.querySelector(`[data-i="${i}"][data-k="name"]`).value = r.name || "";
        document.querySelector(`[data-i="${i}"][data-k="bags"]`).value = r.bags || "";
        document.querySelector(`[data-i="${i}"][data-k="kgPerBag"]`).value = r.kgPerBag || 40;
        updateRow(i);
      }
    });
    document.getElementById("f-name").value = rec.name || "";
  } finally { _cplRestoring = false; }
}
document.getElementById("f-date").addEventListener("change", ()=>{
  const date = document.getElementById("f-date").value;
  if(!date) return;
  const rec = cplDbGet(date, "feedstock");
  if(rec){
    if(cplFeedRows().length === 0 || confirm("A saved record already exists for this date. Load it? (OK = load the saved record, Cancel = keep what is on screen and overwrite it)")){
      cplRestoreFeed(rec);
      cplStatus("Loaded the saved record for this date.");
      return;
    }
  }
  cplScheduleSave();
});
document.addEventListener("input", cplScheduleSave);
document.addEventListener("change", cplScheduleSave);
document.addEventListener("click", (e)=>{ if(e.target.closest && e.target.closest("button")) cplScheduleSave(); });
cplStatus("Pick a Date to start saving this record automatically.");

function fmtDate(d){
  if(!d) return "";
  const [y,m,day] = d.split("-");
  return `${day}/${m}/${y.slice(2)}`;
}

function collectFeeds(){
  const rows = [];
  const trs = document.querySelectorAll("#feed-table tbody tr");
  trs.forEach(tr=>{
    const i = tr.id.replace("row-","");
    const name = val(i,"name");
    const bags = val(i,"bags");
    const kgPerBag = val(i,"kgPerBag");
    const total = document.getElementById(`total-${i}`).value;
    if(!name && !bags) return;
    rows.push([name || "—", bags || "0", kgPerBag || "0", total || "0"]);
  });
  return rows;
}

function generatePDF(){
  const date = document.getElementById("f-date").value;
  const name = document.getElementById("f-name").value;
  const grandTotal = document.getElementById("grand-total").textContent;
  const rows = collectFeeds();

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"pt", format:"a4" });
  const pageW = doc.internal.pageSize.getWidth();
  const marginL = 34;
  const marginR = 34;

  doc.setFont("helvetica","bold");
  doc.setFontSize(13);
  doc.setTextColor(43,65,39);
  doc.text("CPL COCONUT PRODUCTS LIMITED — POULTRY DIVISION", pageW/2, 24, {align:"center"});
  doc.setFontSize(11.5);
  doc.text("FEED STOCK CALCULATOR", pageW/2, 39, {align:"center"});
  doc.setDrawColor(201,138,44);
  doc.setLineWidth(1.5);
  doc.line(marginL, 46, pageW - marginR, 46);
  doc.setTextColor(0,0,0);

  doc.setFont("helvetica","normal");
  doc.setFontSize(9.5);
  doc.text(`Date: ${fmtDate(date) || "_______________________"}`, marginL, 60);
  doc.text(`Recorded By: ${name || "_______________________"}`, marginL + 260, 60);

  doc.autoTable({
    startY: 72,
    margin:{left:marginL,right:marginR},
    styles:{ fontSize:9.5, cellPadding:8, halign:"center", lineColor:[180,180,170], lineWidth:0.4 },
    headStyles:{ fillColor:[47,72,45], textColor:[255,255,255], fontStyle:"bold" },
    head:[["Name of Feed","No. of Bags","Kg per Bag","Total Kg"]],
    body: rows.length ? rows : [["—","—","—","—"]],
    columnStyles:{ 0:{halign:"left",fontStyle:"bold"}, 3:{textColor:[179,38,30],fontStyle:"bold"} },
  });

  let y = doc.lastAutoTable.finalY + 24;
  if(y > 780){ doc.addPage(); y = 40; }

  doc.setFont("helvetica","bold");
  doc.setFontSize(13);
  doc.setTextColor(179,38,30);
  doc.text(`TOTAL FEED (KG): ${grandTotal}`, marginL, y);
  doc.setTextColor(0,0,0);

  const todayNice = new Date().toLocaleDateString("en-GB").split("/").join(" ");
  const fname = `${fmtDate(date).replace(/\//g," ") || todayNice} Feed Stock Calculator.pdf`;
  doc.save(fname);
}

function clearForm(){
  if(!confirm("Clear all entered data?")) return;
  document.querySelector("#feed-table tbody").innerHTML = "";
  rowCount = 0;
  addFeed();
  document.getElementById("f-date").value = "";
  document.getElementById("f-name").value = "";
  clearTimeout(_cplTimer);
  cplStatus("Form cleared. The saved record is still in the database — pick the date again to load it.");
}

// Warn before an accidental refresh, back button, or tab close wipes anything typed in.
// This can't bring data back after a refresh actually happens — it just gives a chance to cancel first.
let formTouched = false;
document.addEventListener("input", ()=>{ formTouched = true; });
document.addEventListener("change", ()=>{ formTouched = true; });
window.addEventListener("beforeunload", (e)=>{
  if(!formTouched) return;
  e.preventDefault();
  e.returnValue = "";
});
if(typeof clearForm === "function"){
  const _origClearForm = clearForm;
  clearForm = function(){
    _origClearForm();
    formTouched = false;
  };
}
</script>
</body>
</html>
